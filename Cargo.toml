[workspace]
members = [
    "crates/contracts",
    "crates/core",
    "crates/engines",
    "crates/strategy",
    "crates/metrics",
    "crates/runner",
    "crates/pybind",
    "crates/examples",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decimal arithmetic (no float for money)
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Bitflags
bitflags = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# Logging
log = "0.4"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
